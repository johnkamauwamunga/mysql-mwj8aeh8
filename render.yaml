
services:
  - type: pserv
    name: mysql
    plan: standard
    env: docker
    autoDeploy: false

    disk:
      name: mysql
      mountPath: /var/lib/mysql
      sizeGB: 10

    envVars:
      - fromGroup: mysql

envVarGroups:
  - name: mysql
    envVars:
      - key: MYSQL_DATABASE
        value: ali_cms

      - key: MYSQL_USER
        value: ali_user

      - key: MYSQL_PASSWORD
        value: "Alis@12345"

      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
